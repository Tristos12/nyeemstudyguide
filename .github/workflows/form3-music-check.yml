name: Form 3 Music Theory validation
on:
  push:
    branches: [main]
    paths:
      - 'form-3-music.html'
      - 'form-3-music-bank.js'
      - 'form-3-music-notation.js'
      - 'form-3-music-written.js'
      - 'form-3-music-lessons.js'
      - 'form-3-music-app.js'
      - 'form-3-music-verify.cjs'
      - 'form3-answer-tools.js'
      - 'form3-answer-tools-verify.cjs'
      - '.github/workflows/form3-music-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node form-3-music-verify.cjs && node form3-answer-tools-verify.cjs
