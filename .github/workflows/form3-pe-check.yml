name: Form 3 PE validation
on:
  push:
    branches: [main]
    paths:
      - 'form-3-pe.html'
      - 'form-3-pe-bank.js'
      - 'form-3-pe-written.js'
      - 'form-3-pe-lessons.js'
      - 'form-3-pe-app.js'
      - 'form-3-pe-verify.cjs'
      - 'form3-answer-tools.js'
      - 'form3-answer-tools-verify.cjs'
      - '.github/workflows/form3-pe-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node form-3-pe-verify.cjs && node form3-answer-tools-verify.cjs
