name: Form 3 Principles of Accounts validation
on:
  push:
    branches: [main]
    paths:
      - 'form-3-poa.html'
      - 'form-3-poa-bank.js'
      - 'form-3-poa-written.js'
      - 'form-3-poa-lessons.js'
      - 'form-3-poa-diagrams.js'
      - 'form-3-poa-app.js'
      - 'form-3-poa-verify.cjs'
      - 'form3-answer-tools.js'
      - 'form3-answer-tools-verify.cjs'
      - '.github/workflows/form3-poa-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node form-3-poa-verify.cjs && node form3-answer-tools-verify.cjs
