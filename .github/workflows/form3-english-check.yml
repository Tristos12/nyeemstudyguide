name: Form 3 English practice validation
on:
  push:
    branches: [main]
    paths:
      - 'form-3-english.html'
      - 'form-3-expanded-a.js'
      - 'form-3-expanded-b.js'
      - 'form-3-verify.cjs'
      - 'form-3-english-practices.html'
      - 'form-3-paper-additions.js'
      - 'form-3-paper-verify.cjs'
      - 'form-3-english-assessments.html'
      - 'form-3-paper2-bank.js'
      - 'form-3-assessment-verify.cjs'
      - 'form-3-detailed-lessons.js'
      - 'form-3-lesson-path.js'
      - 'form-3-lesson-verify.cjs'
      - '.github/workflows/form3-english-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-practices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all Form 3 question banks and 30 practices
        run: node form-3-verify.cjs && node form-3-paper-verify.cjs && node form-3-assessment-verify.cjs && node form-3-lesson-verify.cjs
