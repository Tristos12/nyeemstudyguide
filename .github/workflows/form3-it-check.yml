name: Form 3 Information Technology validation
on:
  push:
    branches: [main]
    paths:
      - 'form-3-it.html'
      - 'form-3-it-bank.js'
      - 'form-3-it-written.js'
      - 'form-3-it-lessons.js'
      - 'form-3-it-diagrams.js'
      - 'form-3-it-app.js'
      - 'form-3-it-verify.cjs'
      - 'form3-answer-tools.js'
      - 'form3-answer-tools-verify.cjs'
      - '.github/workflows/form3-it-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node form-3-it-verify.cjs && node form3-answer-tools-verify.cjs
