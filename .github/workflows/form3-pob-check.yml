name: Form 3 Principles of Business validation
on:
  push:
    branches: [main]
    paths:
      - 'form-3-pob.html'
      - 'form-3-pob-bank.js'
      - 'form-3-pob-written.js'
      - 'form-3-pob-lessons.js'
      - 'form-3-pob-app.js'
      - 'form-3-pob-verify.cjs'
      - 'form3-answer-tools.js'
      - 'form3-answer-tools-verify.cjs'
      - '.github/workflows/form3-pob-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node form-3-pob-verify.cjs && node form3-answer-tools-verify.cjs
