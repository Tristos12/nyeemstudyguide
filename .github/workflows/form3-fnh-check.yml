name: Form 3 Food Nutrition Health validation
on:
  push:
    branches: [main]
    paths:
      - 'form-3-fnh.html'
      - 'form-3-fnh-bank.js'
      - 'form-3-fnh-written.js'
      - 'form-3-fnh-lessons.js'
      - 'form-3-fnh-diagrams.js'
      - 'form-3-fnh-app.js'
      - 'form-3-fnh-verify.cjs'
      - 'form3-answer-tools.js'
      - 'form3-answer-tools-verify.cjs'
      - '.github/workflows/form3-fnh-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node form-3-fnh-verify.cjs && node form3-answer-tools-verify.cjs
