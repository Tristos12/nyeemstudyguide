name: Form 3 Building Technology validation
on:
  push:
    branches: [main]
    paths:
      - 'form-3-building.html'
      - 'form-3-building-bank.js'
      - 'form-3-building-written.js'
      - 'form-3-building-lessons.js'
      - 'form-3-building-diagrams.js'
      - 'form-3-building-app.js'
      - 'form-3-building-verify.cjs'
      - 'form3-answer-tools.js'
      - 'form3-answer-tools-verify.cjs'
      - '.github/workflows/form3-building-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node form-3-building-verify.cjs && node form3-answer-tools-verify.cjs
