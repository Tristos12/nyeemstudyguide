name: CTEC Assessment Backend Safety Tests
on:
  push:
    paths:
      - 'assessment-backend/**'
      - '.github/workflows/ctec-assessment-tests.yml'
  pull_request:
    paths:
      - 'assessment-backend/**'
      - '.github/workflows/ctec-assessment-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run fail-closed and health checks
        working-directory: assessment-backend
        env:
          ASSESSMENT_ENABLED: 'false'
        run: node --test assessment.test.cjs feedback-pipeline.test.cjs
      - name: Smoke-test public deployed endpoint (no student data)
        if: github.event_name == 'push'
        env:
          ASSESSMENT_URL: https://babonneau-ctec-writing-feedback.vercel.app
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = process.env.ASSESSMENT_URL;
          const health = await fetch(base + '/api/health', {signal: AbortSignal.timeout(12000), headers: {'Accept': 'application/json'}});
          assert.equal(health.status, 200, 'Health endpoint must be publicly reachable');
          const state = await health.json();
          assert.equal(state.service, 'ctec-writing-feedback');
          assert.equal(state.assessmentEnabled, false, 'Students must remain disabled');
          assert.equal(state.studentSubmissionsEnabled, false, 'No student submissions permitted');
          const refused = await fetch(base + '/api/assess', {
            method: 'POST', signal: AbortSignal.timeout(12000),
            headers: {'Content-Type': 'application/json', Origin: 'https://tristos12.github.io', Referer: 'https://tristos12.github.io/nyeemstudyguide/ctec-english-guide.html'},
            body: JSON.stringify({answer:'Fictional test response without personal information.', task:'TEST', rubric:'TEST', turnstileToken:'invalid'})
          });
          assert.equal(refused.status, 503, 'Disabled assessment must refuse requests');
          const result = await refused.json();
          assert.equal(result.error, 'assessment_not_enabled');
          // Reproduce browser CORS preflight without submitting work or using pilot keys.
          const preflight = await fetch(base + '/api/pilot', {
            method:'OPTIONS',signal:AbortSignal.timeout(12000),
            headers:{
              Origin:'https://tristos12.github.io',
              Referer:'https://tristos12.github.io/nyeemstudyguide/ctec-teacher-trial.html',
              'Access-Control-Request-Method':'POST',
              'Access-Control-Request-Headers':'content-type,x-bss-pilot-key'
            }
          });
          assert.equal(preflight.status,204,'Pilot CORS preflight must succeed: '+preflight.status);
          assert.equal(preflight.headers.get('access-control-allow-origin'),'https://tristos12.github.io');
          assert.match(preflight.headers.get('access-control-allow-headers')||'',/x-bss-pilot-key/i);
          const pilotRefusal=await fetch(base+'/api/pilot',{
            method:'POST',signal:AbortSignal.timeout(12000),
            headers:{Origin:'https://tristos12.github.io',Referer:'https://tristos12.github.io/nyeemstudyguide/ctec-teacher-trial.html','Content-Type':'application/json','X-BSS-Pilot-Key':'deliberately-invalid'},
            body:JSON.stringify({answer:'Only synthetic test content.',task:'Test',rubric:'Test',consent:true,turnstileToken:'invalid'})
          });
          assert.equal(pilotRefusal.status,403,'Invalid pilot token must be rejected');
          assert.equal(pilotRefusal.headers.get('access-control-allow-origin'),'https://tristos12.github.io');
          console.log('Production health, disabled-state, and protected pilot CORS checks passed.');
          NODE
