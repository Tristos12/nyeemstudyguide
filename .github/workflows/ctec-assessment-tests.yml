name: CTEC Assessment Backend Safety Tests
on:
  push:
    paths:
      - 'assessment-backend/**'
      - '.github/workflows/ctec-assessment-tests.yml'
  pull_request:
    paths:
      - 'assessment-backend/**'
      - '.github/workflows/ctec-assessment-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run fail-closed and health checks
        working-directory: assessment-backend
        env:
          ASSESSMENT_ENABLED: 'false'
        run: node --test assessment.test.cjs
