name: Form 3 Office Administration validation
on:
  push:
    branches: [main]
    paths:
      - 'form-3-office.html'
      - 'form-3-office-bank.js'
      - 'form-3-office-written.js'
      - 'form-3-office-lessons.js'
      - 'form-3-office-diagrams.js'
      - 'form-3-office-app.js'
      - 'form-3-office-verify.cjs'
      - 'form3-answer-tools.js'
      - 'form3-answer-tools-verify.cjs'
      - '.github/workflows/form3-office-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node form-3-office-verify.cjs && node form3-answer-tools-verify.cjs
