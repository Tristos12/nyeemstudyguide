name: Form 3 Mathematics validation
on:
  push:
    branches: [main]
    paths:
      - 'form-3-mathematics.html'
      - 'form-3-math-practices.html'
      - 'form-3-maths-bank.js'
      - 'form-3-maths-lessons.js'
      - 'form-3-maths-structured.js'
      - 'form-3-maths-app.js'
      - 'form-3-maths-verify.cjs'
      - 'form-3-maths-browser-smoke.cjs'
      - 'form-3-math-mocks.html'
      - 'form-3-math-mocks.js'
      - 'form-3-maths-mocks-smoke.cjs'
      - 'form-3-math-structured.html'
      - 'form-3-math-structured-app.js'
      - 'form-3-maths-structured-smoke.cjs'
      - '.github/workflows/form3-mathematics-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node form-3-maths-verify.cjs && node form-3-maths-browser-smoke.cjs && node form-3-maths-mocks-smoke.cjs && node form-3-maths-structured-smoke.cjs
